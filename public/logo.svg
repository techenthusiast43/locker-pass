<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#04070c" />
    </radialGradient>

    <!-- Emerald-Cyan Glow Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Neon Circuit Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="16 8 4 8" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Node Dots along perimeter -->
  <circle cx="256" cy="20" r="4.5" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="492" cy="256" r="4.5" fill="#06b6d4" filter="url(#neonGlow)" />
  <circle cx="256" cy="492" r="4.5" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="20" cy="256" r="4.5" fill="#06b6d4" filter="url(#neonGlow)" />

  <!-- Shackle (Top U-Shape of Lock) -->
  <path d="M176 220 V144 C176 99.8 211.8 64 256 64 C300.2 64 336 99.8 336 144 V220" 
        fill="none" 
        stroke="url(#shackleGrad)" 
        stroke-width="32" 
        stroke-linecap="round"
        filter="url(#neonGlow)" />

  <!-- Shackle Inner Highlight -->
  <path d="M192 205 V144 C192 108.6 220.6 80 256 80 C291.4 80 320 108.6 320 144 V205" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        opacity="0.35" 
        stroke-linecap="round" />

  <!-- Lock Main Body -->
  <rect x="116" y="200" width="280" height="236" rx="42" fill="url(#bodyGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Outer Body Neon Border Accent -->
  <rect x="120" y="204" width="272" height="228" rx="38" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.8" filter="url(#neonGlow)" />

  <!-- Cybernetic Corner Cut Accents -->
  <line x1="148" y1="204" x2="148" y2="236" stroke="#10b981" stroke-width="3" />
  <line x1="120" y1="232" x2="152" y2="232" stroke="#10b981" stroke-width="3" />

  <line x1="364" y1="204" x2="364" y2="236" stroke="#06b6d4" stroke-width="3" />
  <line x1="360" y1="232" x2="392" y2="232" stroke="#06b6d4" stroke-width="3" />

  <!-- Central Vault Dial Outer Track -->
  <circle cx="256" cy="318" r="76" fill="#0b111e" stroke="#334155" stroke-width="4" />
  <circle cx="256" cy="318" r="70" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-dasharray="8 6" filter="url(#neonGlow)" />

  <!-- Center Dial Inner Core -->
  <circle cx="256" cy="318" r="48" fill="#111827" stroke="#1e293b" stroke-width="3" />

  <!-- Glowing Radial Dial Ticks -->
  <line x1="256" y1="274" x2="256" y2="282" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="354" x2="256" y2="362" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <line x1="212" y1="318" x2="220" y2="318" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="292" y1="318" x2="300" y2="318" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <!-- Keyhole / Token Gateway Symbol -->
  <path d="M256 298 C246 298 238 306 238 316 C238 322.8 242.2 328.7 248.2 331.6 L245 346 C244.5 348 246 350 248 350 L264 350 C266 350 267.5 348 267 346 L263.8 331.6 C269.8 328.7 274 322.8 274 316 C274 306 266 298 256 298 Z" 
        fill="url(#primaryGrad)" 
        filter="url(#neonGlow)" />

  <!-- Electronic LED Status Light -->
  <circle cx="366" cy="230" r="5" fill="#10b981" filter="url(#softGlow)" />

  <!-- Decorative Circuit Traces -->
  <path d="M148 400 H190 L206 416 H240" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <circle cx="240" cy="416" r="3" fill="#10b981" opacity="0.7" />

  <path d="M364 400 H322 L306 416 H272" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <circle cx="272" cy="416" r="3" fill="#06b6d4" opacity="0.7" />
</svg>
